name: Android CI

on:
  push:
    # '+' is a pattern operator in branch filters, so it must be escaped to match literally.
    branches: [ main, 'rewrite/clean-code-arc-mvvm\+i' ]
  pull_request:
    branches: [ main, 'rewrite/clean-code-arc-mvvm\+i' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # AGP 8.13 requires JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Validates the wrapper jar and caches Gradle dependencies/build outputs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # google-services.json is gitignored. The GOOGLE_SERVICES_JSON secret may hold the raw
      # JSON or its base64 encoding. Without it (e.g. PRs from forks) a placeholder for
      # io.vonley.mi is generated so the app still builds; Firebase is inert in that build.
      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          target=app/google-services.json
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if printf '%s' "$GOOGLE_SERVICES_JSON" | jq -e . > /dev/null 2>&1; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > "$target"
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > "$target"
            fi
            jq -e '.client[].client_info.android_client_info.package_name' "$target" > /dev/null \
              || { echo "::error::GOOGLE_SERVICES_JSON is not a valid google-services.json"; exit 1; }
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set; building with a placeholder google-services.json"
            cat > "$target" <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "mi-ci-placeholder",
              "storage_bucket": "mi-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "io.vonley.mi" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyA-placeholder-key-for-ci-builds00" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      # Debug builds and unit tests for both flavors (playstation, playstationTest).
      - name: Build and test
        run: >
          ./gradlew --stacktrace
          assemblePlaystationDebug assemblePlaystationTestDebug
          testPlaystationDebugUnitTest testPlaystationTestDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
